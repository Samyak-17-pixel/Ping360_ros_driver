# Default parameters for ping360_driver_node.
# Override on the command line, e.g.:
#   ros2 launch ping360_driver ping360_bringup.launch.py serial_port:=/dev/ttyACM0
# or pass another YAML with --params-file.
ping360_driver:
  ros__parameters:
    serial_port: "/dev/ttyUSB0"
    baud_rate: 115200
    frame_id: "ping360_link"
    publish_tf_static: false
    tf_parent_frame: "base_link"
    tf_translation_xyz: [0.0, 0.0, 0.0]
    tf_rotation_rpy_deg: [0.0, 0.0, 0.0]
    speed_of_sound_mps: 1500.0
    device_dst_id: 1
    gain_setting: 1
    transmit_duration_us: 12
    sample_period_25ns: 88
    transmit_frequency_khz: 740
    number_of_samples: 400
    start_angle_gradians: 0
    stop_angle_gradians: 399
    num_steps: 1
    delay_ms: 0
    send_init_break: true
    reopen_serial_period_s: 3.0
